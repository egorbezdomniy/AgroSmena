<div class="field {% if field.errors %}has-error{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}<label class="check-label">{{ field }} {{ field.label }}</label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required"> *</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
