{% if is_paginated %}<nav class="pagination" aria-label="Страницы списка">
{% if page_obj.has_previous %}<a class="button" href="{% querystring page=page_obj.previous_page_number %}">← Назад</a>{% endif %}
<span>{{ page_obj.number }} / {{ paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="button" href="{% querystring page=page_obj.next_page_number %}">Далее →</a>{% endif %}
</nav>{% endif %}
