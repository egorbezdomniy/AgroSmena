{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог - ПромТехСинергия</title>

    <link rel="stylesheet" href="{% static 'web/portfolio/agro/assets/main/css/catalog.css' %}">
<link rel="stylesheet" href="{% static 'web/portfolio/demo-assets/preview-bar.css' %}">
</head>
<body>
<div class="portfolio-preview-bar"><a href="{% url 'web:portfolio:home' %}">Все проекты</a><span>Демо-каталог</span></div>
<header>

<link rel="stylesheet" href="{% static 'web/portfolio/agro/assets/main/css/navbar.css' %}">

<header class="navbar-container">
    <div class="navbar-left">
        <a href="{% url 'web:portfolio:home' %}agro/" class="nav-link">
            <span class="navbar-item" id="logo">Трансконвей</span>
        </a>
    </div>
    <button class="menu-toggle" aria-label="Toggle menu">
        ☰
    </button>
    <nav class="navbar-right">
        <a href="{% url 'web:portfolio:home' %}agro/catalog/" class="nav-link">
            <span class="navbar-item">Каталог</span>
        </a>
        <a href="#footer" class="nav-link">
            <span class="navbar-item">Контакты</span>
        </a>
    </nav>
</header>
<script src="{% static 'web/portfolio/agro/assets/main/js/navbar.js' %}"></script>

</header>

<div class="product-container">


<link rel="stylesheet" href="{% static 'web/portfolio/agro/assets/main/css/card.css' %}">

<a href="{% url 'web:portfolio:home' %}agro/products/dosing/" class="product-card">

        <div class="product-image">
            <img src="{% static 'web/portfolio/agro/assets/main/images/image1.jpg.webp' %}" alt="Демо-дозатор" class="product-main-image">
        </div>

    <div class="product-info">
        <h3 class="product-title">Демо-дозатор</h3>

    </div>
</a>



<link rel="stylesheet" href="{% static 'web/portfolio/agro/assets/main/css/card.css' %}">

<a href="{% url 'web:portfolio:home' %}agro/products/packing/" class="product-card">

        <div class="product-image">
            <img src="{% static 'web/portfolio/agro/assets/main/images/image3.jpg.webp' %}" alt="Демо-упаковщик" class="product-main-image">
        </div>

    <div class="product-info">
        <h3 class="product-title">Демо-упаковщик</h3>

    </div>
</a>


</div>
<div id="footer">
    <footer id="footer" style="background-color: #2c3e50; color: #ecf0f1; padding: 20px 0; text-align: center; font-family: Arial, sans-serif;">
  <div style="margin-bottom: 10px;">
    <p style="margin: 5px 0; font-size: 28px;">ООО «Трансконвей»</p>
  </div>
  <p>Демонстрационный каталог оборудования</p>
</footer>

</div>


<script src="{% static 'web/portfolio/agro/assets/main/js/catalog.js' %}"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function(e) {
            e.preventDefault();
            const targetId = this.getAttribute("href").substring(1);
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
                window.scrollTo({
                    top: targetElement.offsetTop,
                    behavior: "smooth"
                });
            }
        });
    });
});
</script>
</body>
</html>
